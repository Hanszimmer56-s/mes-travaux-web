<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice Simple</title>
    <link rel="stylesheet" href="../css/calcostyle.css">
</head>
<body>
    <div class="calculator">
        <input type="text" id=" " disabled placeholder="Opération">
        <input type="text" id=" " disabled placeholder="Résultat">
        <div class="buttons">
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('/')" class="op">/</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('*')" class="op">*</button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('-')" class="op">-</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')" class="point">.</button>
            <button onclick="appendToDisplay('+')" class="op">+</button>
            <button onclick="clearDisplayAll()" class="clear">C</button>
            <button onclick="clearDisplay()" class="clear">DE</button>
            <button onclick="calculateResult()" class="equal">=</button>
        </div>
    </div>
    <script src="../Javascript/calcoscript.js"></script>
</body>
</html>
